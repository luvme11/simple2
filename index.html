<style>
  :root {
    --bg: #fff8d9;
    --ink: #1f2a1f;
    --field: #ffffff;
    --paper: #fffdf3;
    --side: #fbf5d6;
    --accent: #3f7a3a;
    --muted: #6b786a;
    --line: rgba(31, 42, 31, 0.14);
    --hl: #fff0b8;
    --sh: 40px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background:
      radial-gradient(60vmax 50vmax at 10% 6%, #f1f6c4 0%, transparent 60%),
      radial-gradient(50vmax 45vmax at 92% 18%, #ffe8bd 0%, transparent 60%),
      radial-gradient(60vmax 50vmax at 50% 108%, #e2f0cc 0%, transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  main { padding: 0 20px; }

  /* ---------- 검색창 ---------- */
  .search {
    position: absolute;
    top: 26%;
    left: 50%;
    transform: translateX(-50%);
    width: min(440px, calc(100% - 40px));
    height: var(--sh);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px 0 18px;
    background: var(--field);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(63, 122, 58, 0.14);
  }
  .search:focus-within { outline: none; }
  .field { position: relative; flex: 1; min-width: 0; height: 100%; }
  .ghost {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    pointer-events: none;
  }
  .ghost .caret {
    flex: none;
    width: 1.5px;
    height: 16px;
    margin-left: 1px;
    background: var(--ink);
    animation: blink 1s steps(1) infinite;
  }
  .field.active .ghost { display: none; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ghost .caret { animation: none; } }
  .search input {
    width: 100%;
    min-width: 0;
    height: 100%;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    outline: none;
  }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    border-radius: 50%;
  }
  .icon-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #toggle:focus, #toggle:focus-visible { outline: none; }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.playing { background: var(--ink); color: var(--field); }
  .music.off { opacity: 0.35; }
  .music .i-pause { display: none; }
  .music.playing .i-pause { display: block; }
  .music.playing .i-note { display: none; }

  .menu {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 14px;
    width: 34px;
    height: 34px;
    transition: background 0.15s;
  }
  .menu:hover { background: rgba(31, 42, 31, 0.08); }
  .menu svg { width: 18px; height: 18px; }

  /* ---------- 글 카드 ---------- */
  .card {
    position: absolute;
    top: calc(26% + var(--sh) + 14px);
    left: 50%;
    transform: translateX(-50%);
    width: min(440px, calc(100% - 40px));
    padding: 16px 22px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(63, 122, 58, 0.12);
    font-size: 14px;
    line-height: 1.9;
  }
  .card[hidden] { display: none; }
  .card .entry { margin: 0; }
  .card sup { margin-right: 6px; font-size: 11px; }
  .card .pos { margin-right: 6px; color: var(--accent); }
  .card .hl {
    padding: 1px 3px;
    border-radius: 4px;
    background: linear-gradient(var(--hl), var(--hl)) no-repeat left center / 0% 100%;
    transition: background-size 0.9s ease;
  }
  .card .hl.on { background-size: 100% 100%; }

  /* ---------- 관리자 팝업 ---------- */
  .admin-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(31, 42, 31, 0.38);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .admin-overlay[hidden] { display: none; }
  .admin {
    width: min(820px, 100%);
    height: min(560px, 100%);
    display: flex;
    flex-direction: column;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 30px 70px rgba(31, 42, 31, 0.3);
    overflow: hidden;
    animation: pop 0.22s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  .admin-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 14px 22px;
    border-bottom: 1px solid var(--line);
  }
  .admin-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .admin-head .tag { margin-left: 8px; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; color: var(--muted); }
  #admin-close { width: 30px; height: 30px; }
  #admin-close:hover { background: rgba(31, 42, 31, 0.08); }
  .admin-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 190px 1fr; }
  .admin-nav {
    overflow-y: auto;
    padding: 12px 10px;
    background: var(--side);
    border-right: 1px solid var(--line);
  }
  .admin-nav .group {
    margin: 16px 12px 6px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  .admin-nav .group:first-child { margin-top: 6px; }
  .admin-nav .tab {
    display: block;
    width: 100%;
    padding: 8px 12px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  .admin-nav .tab:hover { background: rgba(63, 122, 58, 0.1); }
  .admin-nav .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .admin-nav .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .admin-panel { overflow-y: auto; padding: 24px 28px; outline: none; }
  .admin-panel h3 { margin: 0 0 6px; font-size: 18px; }
  .admin-panel .desc {
    margin: 0 0 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .pane[hidden] { display: none; }
  .admin-panel .label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 18px 0 6px;
    font-size: 12px;
    font-weight: 700;
  }
  .admin-panel .pane > .label:first-child { margin-top: 0; }
  .admin-panel .label span { font-weight: 400; color: var(--muted); }
  .admin-panel .row { display: flex; gap: 8px; }
  .admin-panel .in {
    width: 100%;
    min-width: 0;
    padding: 9px 12px;
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
  }
  .admin-panel .in:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .admin-panel textarea.in { min-height: 58px; line-height: 1.6; resize: vertical; }
  .admin-panel .in.pos { width: 78px; flex: none; align-self: flex-start; }
  .admin-panel input[type="file"] { max-width: 100%; font-size: 12px; }
  .admin-panel input[type="range"] { width: 100%; accent-color: var(--accent); }
  .admin-panel .status { margin: 16px 0 0; font-size: 12px; color: var(--muted); }

  /* 섹션 편집기 */
  .hint {
    margin: 0 0 14px;
    padding: 10px 14px;
    background: var(--side);
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
  }
  .hint b { color: var(--ink); background: var(--hl); padding: 0 3px; border-radius: 3px; font-weight: 600; }
  .sec {
    margin-bottom: 14px;
    padding: 14px;
    border: 1.5px solid var(--line);
    border-radius: 16px;
    background: #fff;
  }
  .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .chip {
    flex: none;
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
  }
  .ent { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: start; margin-bottom: 12px; }
  .ent .num { padding-top: 10px; font-size: 11px; text-align: center; color: var(--muted); }
  .ent-row { display: flex; gap: 6px; }
  .ent-btns { display: flex; flex-direction: column; gap: 6px; }
  .pv {
    margin-top: 6px;
    padding: 6px 12px;
    border-radius: 10px;
    background: var(--side);
    font-size: 12.5px;
    line-height: 1.8;
  }
  .pv mark { padding: 1px 3px; border-radius: 4px; background: var(--hl); color: inherit; }
  .pv .empty { color: var(--muted); }
  .mini {
    padding: 6px 11px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
  }
  .mini:hover:not(:disabled) { background: var(--hl); }
  .mini:disabled { opacity: 0.3; }
  .mini:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .mini.sq { width: 30px; padding: 6px 0; text-align: center; }
  .mini.danger, .mini.danger:hover:not(:disabled) { background: #ffe3df; border-color: #b3261e; color: #b3261e; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .btn.light { background: #fff; color: var(--ink); }
  .btn.light.danger { background: #ffe3df; border-color: #b3261e; color: #b3261e; }

  /* 이미지(파비콘·커서) 패널 */
  .img-row { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .img-prev {
    flex: none;
    display: grid;
    place-items: center;
    width: 112px;
    height: 112px;
    border: 1.5px dashed var(--line);
    border-radius: 16px;
    background: #fff;
  }
  .img-prev img { image-rendering: pixelated; }
  .img-ctl { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; }
  .img-ctl .status { margin: 0; }

  .admin-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 12px 22px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .btn {
    padding: 8px 18px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 640px) {
    .admin-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .admin-nav {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 10px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .admin-nav .group { display: none; }
    .admin-nav .tab { width: auto; white-space: nowrap; flex: none; }
    .admin-panel { padding: 20px; }
    .ent { grid-template-columns: 1fr; }
    .ent .num { display: none; }
    .ent-btns { flex-direction: row; }
  }
</style>
</head>
<body>
<button class="icon-btn menu" id="menu" type="button" aria-label="메뉴" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg>
</button>

<main>
  <form class="search" id="form" role="search">
    <button class="icon-btn" id="toggle" type="button" aria-label="설명 열기" aria-expanded="false" aria-controls="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <div class="field" id="field">
      <input id="q" type="search" name="q" autocomplete="off" aria-label="검색어">
      <div class="ghost" aria-hidden="true"><span id="typed"></span><span class="caret"></span></div>
    </div>
    <button class="icon-btn music off" id="music" type="button" aria-label="음악 재생" aria-pressed="false" title="음악이 아직 없어요">
      <svg class="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
    </button>
  </form>
  <div class="card" id="card" hidden></div>
</main>

<!-- 관리자 팝업 -->
<div class="admin-overlay" id="admin" hidden>
  <div class="admin" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <header class="admin-head">
      <h2 id="admin-title">관리자<span class="tag">ADMIN · v1</span></h2>
      <button class="icon-btn" id="admin-close" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="admin-body">
      <nav class="admin-nav" id="admin-nav" role="tablist" aria-orientation="vertical" aria-label="관리자 메뉴"></nav>
      <section class="admin-panel" id="admin-panel" role="tabpanel" tabindex="0" aria-labelledby="panel-title">
        <h3 id="panel-title"></h3>
        <p class="desc" id="panel-desc"></p>

        <!-- 검색창 · 글 -->
        <div class="pane" data-pane="sections" hidden>
          <p class="hint">
            돋보기를 누를 때마다 위에서부터 차례로 넘어가요. 형광펜을 칠하려면 강조할 글자를 <b>드래그로 선택</b>한 뒤 <b>형광펜</b> 버튼을 누르세요. 이미 칠한 글자를 선택하고 다시 누르면 지워져요.
          </p>
          <div id="sec-list"></div>
          <div class="actions">
            <button class="btn light" id="sec-add" type="button">+ 섹션 추가</button>
            <button class="btn light" id="sec-reset" type="button">처음 내용으로 되돌리기</button>
          </div>
        </div>

        <!-- 음악 -->
        <div class="pane" data-pane="music" hidden>
          <label class="label" for="music-url">곡 주소 <span>mp3 등 직접 링크</span></label>
          <div class="row">
            <input class="in" id="music-url" type="url" placeholder="https://example.com/song.mp3" autocomplete="off">
            <button class="btn" id="music-apply" type="button">적용</button>
          </div>
          <label class="label" for="music-file">또는 파일 선택 <span>이 접속에서만 유지돼요</span></label>
          <input id="music-file" type="file" accept="audio/*">
          <label class="label" for="music-vol">볼륨 <span id="music-vol-out">70%</span></label>
          <input id="music-vol" type="range" min="0" max="100" value="70">
          <p class="status" id="music-status">곡이 아직 없어요.</p>
        </div>

        <!-- 사이트 이름 -->
        <div class="pane" data-pane="title" hidden>
          <label class="label" for="site-title">사이트 이름 <span>입력하면 바로 저장돼요</span></label>
          <input class="in" id="site-title" type="text" maxlength="40" autocomplete="off" placeholder="Home">
        </div>

        <!-- 파비콘 -->
        <div class="pane" data-pane="favicon" hidden>
          <div class="img-row">
            <div class="img-prev"><img id="favicon-prev" width="64" height="64" alt="현재 파비콘"></div>
            <div class="img-ctl">
              <label class="label" for="favicon-file" style="margin:0">이미지 올리기 <span>64px로 줄여서 저장해요</span></label>
              <input id="favicon-file" type="file" accept="image/*">
              <button class="btn light" id="favicon-reset" type="button">기본 해바라기로</button>
              <p class="status" id="favicon-status">기본 해바라기를 쓰고 있어요.</p>
            </div>
          </div>
        </div>

        <!-- 마우스 커서 -->
        <div class="pane" data-pane="cursor" hidden>
          <div class="img-row">
            <div class="img-prev"><img id="cursor-prev" alt="현재 마우스 커서"></div>
            <div class="img-ctl">
              <label class="label" for="cursor-file" style="margin:0">이미지 올리기 <span>긴 변 24px 이하로 줄여서 저장해요</span></label>
              <input id="cursor-file" type="file" accept="image/*">
              <button class="btn light" id="cursor-reset" type="button">기본 꽃잎으로</button>
              <p class="status" id="cursor-status">기본 꽃잎을 쓰고 있어요.</p>
            </div>
          </div>
        </div>
      </section>
    </div>
    <footer class="admin-foot">
      <span id="admin-status">대기 중</span>
      <button class="btn" id="admin-done" type="button">닫기</button>
    </footer>
  </div>
</div>

<script>
  // ---------- 저장소 ----------
  var KEY_SECTIONS = 'home.sections';
  var KEY_URL = 'home.music.url';
  var KEY_VOL = 'home.music.vol';
  var KEY_TITLE = 'home.title';
  var KEY_FAVICON = 'home.favicon';
  var KEY_CURSOR = 'home.cursor';
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  // ---------- 섹션 데이터 (관리자에서 고칠 수 있어요) ----------
  //  - title: 검색창에 타이핑되는 제목
  //  - entries: 카드에 한 줄씩 타이핑되는 글 (pos는 생략 가능)
  //  - [[ ]]로 감싼 부분은 타이핑이 끝난 뒤 노란 형광펜으로 강조돼요.
  var DEFAULT_SECTIONS = [
    {
      title: '별뉘',
      entries: [
        { pos: '명사', text: '작은 틈을 통하여 잠시 비치는 [[햇볕]].' },
        { pos: '명사', text: '그늘진 곳에 미치는 조그마한 [[햇볕]]의 기운.' },
        { pos: '명사', text: '다른 사람으로부터 받는 [[보살핌]]이나 [[보호]].' }
      ]
    },
    { title: '성향', entries: [{ text: '여기에 [[성향]] 내용을 적어주세요.' }] },
    { title: 'NG', entries: [{ text: '여기에 [[NG]] 내용을 적어주세요.' }] },
    { title: '배려 리스트', entries: [{ text: '여기에 [[배려 리스트]] 내용을 적어주세요.' }] }
  ];

  function cloneSections(s) { return JSON.parse(JSON.stringify(s)); }

  function validSections(v) {
    if (!Array.isArray(v) || !v.length) return null;
    var out = [];
    for (var i = 0; i < v.length; i++) {
      var s = v[i];
      if (!s || typeof s.title !== 'string' || !Array.isArray(s.entries) || !s.entries.length) return null;
      var entries = [];
      for (var j = 0; j < s.entries.length; j++) {
        var e = s.entries[j];
        if (!e || typeof e.text !== 'string') return null;
        var item = { text: e.text };
        if (typeof e.pos === 'string' && e.pos) item.pos = e.pos;
        entries.push(item);
      }
      out.push({ title: s.title, entries: entries });
    }
    return out;
  }

  var sections = (function () {
    var raw = lsGet(KEY_SECTIONS);
    if (raw) {
      try { var v = validSections(JSON.parse(raw)); if (v) return v; } catch (e) {}
    }
    return cloneSections(DEFAULT_SECTIONS);
  })();

  // ---------- 검색 ----------
  var form = document.getElementById('form');
  var q = document.getElementById('q');
  var musicBtn = document.getElementById('music');

  function go() {
    var text = q.value.trim();
    if (!text) return;
    window.open('https://www.google.com/search?q=' + encodeURIComponent(text), '_blank', 'noopener');
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); go(); });

  // ---------- 홈: 돋보기 카드 ----------
  var toggle = document.getElementById('toggle');
  var card = document.getElementById('card');

  var CARD_SPEED = 130;  // 글자당 ms (클수록 느려져요)
  var cardRun = 0;

  // 글자 단위로 쪼개고, [[ ]] 안의 글자는 m=true로 표시
  function parseText(t) {
    var out = [];
    t.split(/(\[\[.*?\]\])/).forEach(function (part, g) {
      var m = /^\[\[.*\]\]$/.test(part);
      var s = m ? part.slice(2, -2) : part;
      for (var i = 0; i < s.length; i++) out.push({ c: s[i], m: m, g: g });
    });
    return out;
  }

  // 한 줄씩 타이핑 → 전부 끝나면 형광펜이 차례로 칠해짐
  function typeCard(entries) {
    var run = ++cardRun;
    var ei = 0;
    card.textContent = '';

    function nextEntry() {
      if (run !== cardRun) return;
      if (ei >= entries.length) {
        var hls = card.querySelectorAll('.hl');
        for (var h = 0; h < hls.length; h++) {
          (function (el, d) {
            setTimeout(function () { if (run === cardRun) el.classList.add('on'); }, d);
          })(hls[h], 400 + h * 500);
        }
        return;
      }
      var e = entries[ei];
      var p = document.createElement('p');
      p.className = 'entry';
      var sup = document.createElement('sup');
      sup.textContent = ei + 1;
      p.appendChild(sup);
      if (e.pos) {
        var pos = document.createElement('span');
        pos.className = 'pos';
        pos.textContent = e.pos;
        p.appendChild(pos);
      }
      card.appendChild(p);
      ei++;

      var chars = parseText(e.text);
      var k = 0, node = null, curG = -1;
      function step() {
        if (run !== cardRun) return;
        if (k >= chars.length) { setTimeout(nextEntry, 600); return; }
        var ch = chars[k++];
        if (ch.g !== curG) {
          curG = ch.g;
          if (ch.m) { node = document.createElement('span'); node.className = 'hl'; }
          else { node = document.createTextNode(''); }
          p.appendChild(node);
        }
        node.textContent += ch.c;
        setTimeout(step, CARD_SPEED);
      }
      step();
    }
    nextEntry();
  }

  // 검색창 안 제목 타이핑 (입력창이 비어 있고 포커스가 없을 때만 보여요)
  var field = document.getElementById('field');
  var typed = document.getElementById('typed');
  var TITLE_SPEED = 280;  // 글자당 ms
  var ghostRun = 0;

  function syncActive() {
    field.classList.toggle('active', document.activeElement === q || q.value !== '');
  }
  q.addEventListener('focus', syncActive);
  q.addEventListener('blur', syncActive);
  q.addEventListener('input', syncActive);

  function typeTitle(text, done) {
    var run = ++ghostRun;
    var i = 0;
    typed.textContent = '';
    (function step() {
      if (run !== ghostRun) return;
      if (!text) return;
      if (field.classList.contains('active')) { setTimeout(step, 300); return; }
      i++;
      typed.textContent = text.slice(0, i);
      if (i >= text.length) { if (done) setTimeout(function () { if (run === ghostRun) done(); }, 500); return; }
      setTimeout(step, TITLE_SPEED);
    })();
  }

  // 돋보기: 열기 → 다음 섹션 → ... → 마지막 다음엔 닫기
  var idx = -1;
  toggle.addEventListener('click', function () {
    if (idx === -1) {
      idx = 0;
      card.hidden = false;
      toggle.setAttribute('aria-expanded', 'true');
      typeCard(sections[0].entries);
    } else if (idx < sections.length - 1) {
      idx++;
      var s = sections[idx];
      cardRun++;
      card.textContent = '';
      typeTitle(s.title, function () { typeCard(s.entries); });
    } else {
      idx = -1;
      cardRun++;
      ghostRun++;
      card.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      typed.textContent = sections[0].title;
    }
  });

  // 관리자에서 내용을 고친 뒤 홈을 처음 상태로 다시 시작
  function refreshHome() {
    idx = -1;
    cardRun++;
    card.hidden = true;
    card.textContent = '';
    toggle.setAttribute('aria-expanded', 'false');
    typeTitle(sections[0].title);
  }

  typeTitle(sections[0].title);

  // ---------- 관리자 팝업 ----------
  var adminMenu = [
    { group: '내용' },
    { id: 'sections', name: '검색창 · 글', desc: '검색창에 타이핑되는 제목과, 돋보기를 누르면 나오는 글·형광펜을 고쳐요.' },
    { group: 'SITE' },
    { id: 'music', name: '음악', desc: '홈의 음악 버튼으로 재생될 곡과 볼륨을 정해요.' },
    { id: 'title', name: '사이트 이름', desc: '브라우저 탭에 보이는 이름이에요.' },
    { id: 'favicon', name: '파비콘', desc: '브라우저 탭에 보이는 작은 아이콘이에요.' },
    { id: 'cursor', name: '마우스 커서', desc: '페이지 위에서 마우스 모양을 바꿔요.' }
  ];

  var menuBtn = document.getElementById('menu');
  var admin = document.getElementById('admin');
  var adminNav = document.getElementById('admin-nav');
  var adminStatus = document.getElementById('admin-status');
  var panelTitle = document.getElementById('panel-title');
  var panelDesc = document.getElementById('panel-desc');
  var panes = admin.querySelectorAll('.pane');
  var tabs = [];
  var homeDirty = false;

  function setStatus(t) { adminStatus.textContent = t; }
  function saveResult(ok) {
    setStatus(ok ? '저장됨 · 이 브라우저에 저장돼요' : '저장하지 못했어요 (브라우저 저장소를 쓸 수 없어요)');
  }

  adminMenu.forEach(function (item) {
    if (item.group) {
      var g = document.createElement('div');
      g.className = 'group';
      g.setAttribute('role', 'presentation');
      g.textContent = item.group;
      adminNav.appendChild(g);
      return;
    }
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.textContent = item.name;
    b.dataset.id = item.id;
    b.dataset.desc = item.desc;
    b.addEventListener('click', function () { selectTab(tabs.indexOf(b), false); });
    adminNav.appendChild(b);
    tabs.push(b);
  });

  function selectTab(i, focus) {
    tabs.forEach(function (t, n) {
      var on = n === i;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    var id = tabs[i].dataset.id;
    panelTitle.textContent = tabs[i].textContent;
    panelDesc.textContent = tabs[i].dataset.desc;
    for (var p = 0; p < panes.length; p++) panes[p].hidden = panes[p].dataset.pane !== id;
    if (focus) tabs[i].focus();
  }

  function openAdmin() {
    admin.hidden = false;
    setStatus('대기 중');
    selectTab(0, false);
    document.getElementById('admin-close').focus();
  }
  function closeAdmin() {
    admin.hidden = true;
    menuBtn.focus();
    if (homeDirty) { homeDirty = false; refreshHome(); }
  }

  menuBtn.addEventListener('click', openAdmin);
  document.getElementById('admin-close').addEventListener('click', closeAdmin);
  document.getElementById('admin-done').addEventListener('click', closeAdmin);

  adminNav.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    var cur = tabs.indexOf(document.activeElement);
    if (cur === -1) return;
    var next = (cur + (e.key === 'ArrowDown' ? 1 : -1) + tabs.length) % tabs.length;
    selectTab(next, true);
  });

  document.addEventListener('keydown', function (e) {
    if (admin.hidden) return;
    if (e.key === 'Escape') { closeAdmin(); return; }
    if (e.key === 'Tab') {
      var f = Array.prototype.filter.call(
        admin.querySelectorAll('button, input, textarea, [tabindex="0"]'),
        function (el) { return el.tabIndex >= 0 && !el.disabled && el.offsetParent !== null; }
      );
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // ---------- 관리자: 검색창 · 글 편집기 ----------
  var secList = document.getElementById('sec-list');

  function h(tag, props, kids) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'class') el.className = props[k];
      else if (k === 'text') el.textContent = props[k];
      else el.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) el.appendChild(c); });
    return el;
  }

  function sectionsChanged() {
    homeDirty = true;
    saveResult(lsSet(KEY_SECTIONS, JSON.stringify(sections)));
  }

  // 한 번 더 눌러야 실행되는 버튼 (실수로 지우는 것 방지)
  function twoStep(btn, label, fn) {
    var armed = false, timer = null;
    var orig = btn.getAttribute('aria-label');
    function reset() {
      armed = false;
      btn.textContent = label;
      btn.classList.remove('danger');
      if (orig) btn.setAttribute('aria-label', orig);
    }
    btn.addEventListener('click', function () {
      if (!armed) {
        armed = true;
        btn.textContent = '정말요?';
        btn.classList.add('danger');
        if (orig) btn.setAttribute('aria-label', '정말 지울까요? 한 번 더 누르세요');
        timer = setTimeout(reset, 3000);
        return;
      }
      clearTimeout(timer);
      reset();
      fn();
    });
  }

  function renderMarkup(el, text) {
    el.textContent = '';
    if (!text) {
      var em = document.createElement('span');
      em.className = 'empty';
      em.textContent = '(비어 있어요)';
      el.appendChild(em);
      return;
    }
    text.split(/(\[\[.*?\]\])/).forEach(function (part) {
      if (/^\[\[.*\]\]$/.test(part)) {
        var m = document.createElement('mark');
        m.textContent = part.slice(2, -2);
        el.appendChild(m);
      } else if (part) {
        el.appendChild(document.createTextNode(part));
      }
    });
  }

  // 선택한 글자에 형광펜 켜기/끄기. 바뀌었으면 true
  function toggleHighlight(ta) {
    var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    if (s === e) { setStatus('먼저 강조할 글자를 드래그로 선택해 주세요.'); return false; }
    var sel = v.slice(s, e);
    var wrapped = sel.match(/^\[\[(.*)\]\]$/);
    if (wrapped) {
      ta.value = v.slice(0, s) + wrapped[1] + v.slice(e);
      ta.focus();
      ta.setSelectionRange(s, s + wrapped[1].length);
    } else if (v.slice(s - 2, s) === '[[' && v.slice(e, e + 2) === ']]') {
      ta.value = v.slice(0, s - 2) + sel + v.slice(e + 2);
      ta.focus();
      ta.setSelectionRange(s - 2, e - 2);
    } else {
      var clean = sel.replace(/\[\[|\]\]/g, '');
      ta.value = v.slice(0, s) + '[[' + clean + ']]' + v.slice(e);
      ta.focus();
      ta.setSelectionRange(s + 2, s + 2 + clean.length);
    }
    return true;
  }

  function renderSections(focusSel) {
    secList.textContent = '';
    sections.forEach(function (sec, si) {
      // 제목 줄
      var titleIn = h('input', { type: 'text', class: 'in', value: sec.title, placeholder: '검색창에 타이핑될 제목', 'aria-label': (si + 1) + '번 섹션 제목', 'data-title': String(si) });
      titleIn.addEventListener('input', function () { sec.title = titleIn.value; sectionsChanged(); });

      function move(dir) {
        sections.splice(si + dir, 0, sections.splice(si, 1)[0]);
        sectionsChanged();
        renderSections();
      }
      var up = h('button', { type: 'button', class: 'mini sq', title: '위로', 'aria-label': '섹션 위로', text: '↑' });
      var down = h('button', { type: 'button', class: 'mini sq', title: '아래로', 'aria-label': '섹션 아래로', text: '↓' });
      var delSec = h('button', { type: 'button', class: 'mini', 'aria-label': '이 섹션 삭제', text: '삭제' });
      if (si === 0) up.disabled = true;
      if (si === sections.length - 1) down.disabled = true;
      if (sections.length === 1) delSec.disabled = true;
      up.addEventListener('click', function () { move(-1); });
      down.addEventListener('click', function () { move(1); });
      twoStep(delSec, '삭제', function () {
        sections.splice(si, 1);
        sectionsChanged();
        renderSections();
      });

      var head = h('div', { class: 'sec-head' }, [h('span', { class: 'chip', text: String(si + 1) }), titleIn, up, down, delSec]);

      // 글 줄들
      var ents = h('div', { class: 'ents' });
      sec.entries.forEach(function (en, ei) {
        var pos = h('input', { type: 'text', class: 'in pos', value: en.pos || '', placeholder: '품사', maxlength: '10', 'aria-label': (ei + 1) + '번째 줄 품사(선택)' });
        var ta = h('textarea', { class: 'in', rows: '2', placeholder: '내용 (형광펜은 아래 버튼으로)', 'aria-label': (ei + 1) + '번째 줄 내용', 'data-ta': si + '-' + ei, text: en.text });
        var pv = h('div', { class: 'pv' });
        renderMarkup(pv, en.text);

        pos.addEventListener('input', function () {
          var v = pos.value.trim();
          if (v) en.pos = v; else delete en.pos;
          sectionsChanged();
        });
        ta.addEventListener('input', function () {
          en.text = ta.value;
          renderMarkup(pv, ta.value);
          sectionsChanged();
        });

        var hl = h('button', { type: 'button', class: 'mini', title: '선택한 글자에 형광펜', text: '형광펜' });
        hl.addEventListener('click', function () {
          if (toggleHighlight(ta)) {
            en.text = ta.value;
            renderMarkup(pv, ta.value);
            sectionsChanged();
          }
        });
        var delEnt = h('button', { type: 'button', class: 'mini', 'aria-label': '이 줄 삭제', text: '줄 삭제' });
        if (sec.entries.length === 1) delEnt.disabled = true;
        twoStep(delEnt, '줄 삭제', function () {
          sec.entries.splice(ei, 1);
          sectionsChanged();
          renderSections();
        });

        ents.appendChild(h('div', { class: 'ent' }, [
          h('span', { class: 'num', text: String(ei + 1) }),
          h('div', { class: 'ent-main' }, [h('div', { class: 'ent-row' }, [pos, ta]), pv]),
          h('div', { class: 'ent-btns' }, [hl, delEnt])
        ]));
      });

      var addEnt = h('button', { type: 'button', class: 'mini', text: '+ 줄 추가' });
      addEnt.addEventListener('click', function () {
        sec.entries.push({ text: '' });
        sectionsChanged();
        renderSections('[data-ta="' + si + '-' + (sec.entries.length - 1) + '"]');
      });

      secList.appendChild(h('div', { class: 'sec' }, [head, ents, addEnt]));
    });

    if (focusSel) {
      var t = secList.querySelector(focusSel);
      if (t) { t.focus(); if (t.scrollIntoView) t.scrollIntoView({ block: 'nearest' }); }
    }
  }

  document.getElementById('sec-add').addEventListener('click', function () {
    sections.push({ title: '', entries: [{ text: '' }] });
    sectionsChanged();
    renderSections('[data-title="' + (sections.length - 1) + '"]');
  });
  var secReset = document.getElementById('sec-reset');
  twoStep(secReset, '처음 내용으로 되돌리기', function () {
    sections = cloneSections(DEFAULT_SECTIONS);
    sectionsChanged();
    renderSections();
  });
  renderSections();

  // ---------- 음악 (검색창 오른쪽 버튼) ----------
  var audio = new Audio();
  audio.loop = true;
  audio.preload = 'none';
  var hasSrc = false;
  var objectUrl = null;

  var musicUrl = document.getElementById('music-url');
  var musicFile = document.getElementById('music-file');
  var musicVol = document.getElementById('music-vol');
  var musicVolOut = document.getElementById('music-vol-out');
  var musicStatus = document.getElementById('music-status');

  function syncMusicBtn() {
    var playing = hasSrc && !audio.paused;
    musicBtn.classList.toggle('off', !hasSrc);
    musicBtn.classList.toggle('playing', playing);
    musicBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    musicBtn.setAttribute('aria-label', playing ? '음악 일시정지' : '음악 재생');
    musicBtn.title = hasSrc ? (playing ? '일시정지' : '재생') : '음악이 아직 없어요';
  }
  function setSource(src, statusText) {
    audio.pause();
    if (src) { audio.src = src; hasSrc = true; }
    else { audio.removeAttribute('src'); audio.load(); hasSrc = false; }
    musicStatus.textContent = statusText;
    syncMusicBtn();
  }

  audio.addEventListener('play', syncMusicBtn);
  audio.addEventListener('pause', syncMusicBtn);
  audio.addEventListener('error', function () {
    if (!audio.getAttribute('src')) return;
    hasSrc = false;
    musicStatus.textContent = '곡을 불러올 수 없어요. 주소나 파일을 확인해 주세요.';
    syncMusicBtn();
  });

  musicBtn.addEventListener('click', function () {
    if (!hasSrc) return;
    if (audio.paused) {
      audio.play().catch(function () {
        musicStatus.textContent = '재생할 수 없어요. 주소나 파일을 확인해 주세요.';
      });
    } else {
      audio.pause();
    }
  });

  // 볼륨
  var savedVol = parseInt(lsGet(KEY_VOL), 10);
  if (isNaN(savedVol) || savedVol < 0 || savedVol > 100) savedVol = 70;
  musicVol.value = savedVol;
  musicVolOut.textContent = savedVol + '%';
  audio.volume = savedVol / 100;
  musicVol.addEventListener('input', function () {
    var v = parseInt(musicVol.value, 10);
    audio.volume = v / 100;
    musicVolOut.textContent = v + '%';
    saveResult(lsSet(KEY_VOL, String(v)));
  });

  // 곡 주소
  document.getElementById('music-apply').addEventListener('click', function () {
    var url = musicUrl.value.trim();
    if (!url) {
      lsSet(KEY_URL, '');
      setSource(null, '곡이 아직 없어요.');
      return;
    }
    if (!/^https?:\/\//i.test(url)) {
      musicStatus.textContent = 'http:// 또는 https:// 로 시작하는 주소를 넣어주세요.';
      return;
    }
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    musicFile.value = '';
    saveResult(lsSet(KEY_URL, url));
    setSource(url, '곡이 적용됐어요. 홈의 음악 버튼을 눌러 들어보세요.');
  });

  // 파일 선택 (새로고침하면 사라져요)
  musicFile.addEventListener('change', function () {
    var f = musicFile.files && musicFile.files[0];
    if (!f) return;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(f);
    musicUrl.value = '';
    setSource(objectUrl, '파일 "' + f.name + '"을(를) 불러왔어요. (이 접속에서만 유지돼요)');
  });

  // 저장된 곡 주소 복원
  var savedUrl = lsGet(KEY_URL);
  if (savedUrl) {
    musicUrl.value = savedUrl;
    setSource(savedUrl, '저장된 곡을 불러왔어요.');
  }

  // ---------- 사이트 이름 ----------
  var siteTitle = document.getElementById('site-title');
  var savedTitle = lsGet(KEY_TITLE);
  if (savedTitle) { document.title = savedTitle; siteTitle.value = savedTitle; }
  siteTitle.addEventListener('input', function () {
    var v = siteTitle.value.trim();
    document.title = v || 'Home';
    saveResult(lsSet(KEY_TITLE, v));
  });

  // ---------- 이미지(파비콘 · 마우스 커서) ----------
  var favLink = document.getElementById('favicon');
  var DEFAULT_FAVICON = favLink.getAttribute('href');
  var DEFAULT_CURSOR = { url: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAASCAYAAABit09LAAACSklEQVR42l2SXWjNcRyHn+/v9zvn7JwzNjbsREmrkV1QFIbYlZckxZQWJaW40ZSLXXDkxoUiS4o7rd2cGbkgkr2pebmQsE1ms1Fby2xn7OWcnd//fF1IXp7LT8/d54F/EVUMQMsR9nY3lr3oOBeu539Ukwag/eyC0+l3OwKdXa8fb5quumVE/0ht2xwIrfUc84N7VMeqvL6JBoNXZPIksTL7S8JJ9ZDvPEdy44nay6GSxXN+uN0YcTDurdVsm0nVYKVafPNRu2vtger6SGJNkBtpdWjIEI/rvFIbLipilb3dK3ptky7fcWZDW0llZcyPPlbzY9AQigOBGlUzPpDNuAOqdnvd1iuJNYnCYORBThCndiESduj0uDExKF7MZrNhBeVLypfuZuJtHslbZjNIvATmZlGxQshhHYvMlrpVJ0sTX8P5qc95JCKKAedgZkLF2TyZnH4d5ZlLLPt2nJwSBAXW+CwSKgY/hfpAXIHL595PycgXUo7psQJmAvLTFuPmoDAGk58UF1V8VoZ68t8/vC24a9LD4S7CYQzZIEgHkO4j9zmNi8Y9/Wnb38uFM72ZIfNlINbgpxeJjYTQTIZg9Ie6hcWeqe+RzhbfvrORq6kaLKsh3H1r5SMdqNCZFHPZJ3Gvr4q06xTNVTBPFUmCQQzcOUzF2MOSdPZBJBc8na+vztIAIAYUhN8/A7y8FLuuHVHtuWju/d6T/EoOgFQNVhVpqXUbB5Ki9w+xTxW5sY7Q3wmag80EnEf2N/nnr/tomg2oFkGHC9G/xZ+U9QktPYVt0gAAAABJRU5ErkJggg==', hx: 7, hy: 0 };
  var cursorStyle = document.getElementById('cursor-style');
  var favPrev = document.getElementById('favicon-prev');
  var curPrev = document.getElementById('cursor-prev');
  var favStatus = document.getElementById('favicon-status');
  var curStatus = document.getElementById('cursor-status');

  function applyFavicon(url) {
    favLink.setAttribute('href', url);
    favPrev.src = url;
  }
  function applyCursor(c) {
    cursorStyle.textContent =
      '*, *::before, *::after { cursor: url("' + c.url + '") ' + c.hx + ' ' + c.hy + ', auto !important; }\n' +
      'input[type="search"], input[type="url"], input[type="text"], textarea { cursor: text !important; }';
    curPrev.src = c.url;
    var big = 3;
    var probe = new Image();
    probe.onload = function () { curPrev.width = probe.naturalWidth * big; curPrev.height = probe.naturalHeight * big; };
    probe.src = c.url;
  }

  // 이미지를 maxW×maxH 안으로 줄여서 PNG 데이터 주소로 돌려줘요 (square=true면 정사각 캔버스에 가운데 정렬)
  function shrinkImage(file, max, square, ok, fail) {
    var src = URL.createObjectURL(file);
    var img = new Image();
    img.onerror = function () { URL.revokeObjectURL(src); fail(); };
    img.onload = function () {
      URL.revokeObjectURL(src);
      var iw = img.naturalWidth, ih = img.naturalHeight;
      if (!iw || !ih) { fail(); return; }
      var sc = Math.min(1, max / Math.max(iw, ih));
      var tw = Math.max(1, Math.round(iw * sc));
      var th = Math.max(1, Math.round(ih * sc));
      // 크게 줄일 때는 절반씩 나눠서 줄여야 선명해요
      var cur = img, cw = iw, ch = ih;
      while (cw / 2 > tw && ch / 2 > th) {
        var step = document.createElement('canvas');
        step.width = cw = Math.floor(cw / 2);
        step.height = ch = Math.floor(ch / 2);
        step.getContext('2d').drawImage(cur, 0, 0, cw, ch);
        cur = step;
      }
      var out = document.createElement('canvas');
      out.width = square ? max : tw;
      out.height = square ? max : th;
      var ctx = out.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(cur, square ? Math.round((max - tw) / 2) : 0, square ? Math.round((max - th) / 2) : 0, tw, th);
      ok(out.toDataURL('image/png'));
    };
    img.src = src;
  }

  // 파비콘
  var savedFav = lsGet(KEY_FAVICON);
  if (savedFav) { applyFavicon(savedFav); favStatus.textContent = '올려둔 이미지를 쓰고 있어요.'; }
  else { favPrev.src = DEFAULT_FAVICON; }

  document.getElementById('favicon-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    shrinkImage(f, 64, true, function (url) {
      applyFavicon(url);
      var ok = lsSet(KEY_FAVICON, url);
      favStatus.textContent = ok ? '파비콘이 바뀌었어요.' : '바뀌었지만 저장은 못 했어요. 새로고침하면 사라져요.';
      saveResult(ok);
    }, function () {
      favStatus.textContent = '이미지를 읽을 수 없어요. PNG, JPG 같은 이미지 파일을 올려주세요.';
    });
    e.target.value = '';
  });
  var favReset = document.getElementById('favicon-reset');
  favReset.addEventListener('click', function () {
    lsSet(KEY_FAVICON, '');
    applyFavicon(DEFAULT_FAVICON);
    favStatus.textContent = '기본 해바라기로 되돌렸어요.';
    saveResult(true);
  });

  // 마우스 커서
  var savedCur = null;
  try { savedCur = JSON.parse(lsGet(KEY_CURSOR) || 'null'); } catch (err) { savedCur = null; }
  if (savedCur && typeof savedCur.url === 'string' && savedCur.url.indexOf('data:image/') === 0) {
    applyCursor(savedCur);
    curStatus.textContent = '올려둔 이미지를 쓰고 있어요.';
  } else {
    applyCursor(DEFAULT_CURSOR);
  }

  document.getElementById('cursor-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    shrinkImage(f, 24, false, function (url) {
      var c = { url: url, hx: 0, hy: 0 };
      applyCursor(c);
      var ok = lsSet(KEY_CURSOR, JSON.stringify(c));
      curStatus.textContent = ok ? '마우스 커서가 바뀌었어요. (클릭 위치는 이미지의 왼쪽 위예요)' : '바뀌었지만 저장은 못 했어요. 새로고침하면 사라져요.';
      saveResult(ok);
    }, function () {
      curStatus.textContent = '이미지를 읽을 수 없어요. PNG, JPG 같은 이미지 파일을 올려주세요.';
    });
    e.target.value = '';
  });
  document.getElementById('cursor-reset').addEventListener('click', function () {
    lsSet(KEY_CURSOR, '');
    applyCursor(DEFAULT_CURSOR);
    curStatus.textContent = '기본 꽃잎으로 되돌렸어요.';
    saveResult(true);
  });
</script>
